---
layout: default
---

<a class="back" href="/">
  Home
</a>

<div id="introduction">
  <div id="introduction-image">
    <img src="/assets/images/projects/{{ page.name }}.jpg">
  </div>

  <div id="introduction-items">
    <div>
      <span class="main-title">{{ page.name }}</span>
    </div>
    <div>
      {% for link in page.links %}
        <a href="{{ link }}">{{ link }}</a>
      {% endfor %}
    </div>
  </div>
</div>

<div class="blog-content">
  {{ content }}
</div>

<script src="/assets/js/blog.js"></script>
